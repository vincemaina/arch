# Publish the Swaystone landing page to GitHub Pages.
#
# The page is plain static HTML, CSS and one small script - there is no build
# step and nothing to install, so this workflow only uploads site/ and tells
# Pages to serve it. Pushing anything under site/ republishes it.
name: Pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it half way.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Pages has to be turned on once, by hand, before this can deploy:
      #   Settings -> Pages -> Build and deployment -> Source: GitHub Actions
      #
      # `configure-pages` takes an `enablement: true` input that is supposed to
      # do that through the API. It was tried here and it does not work: the
      # workflow's own GITHUB_TOKEN cannot create a Pages site that has never
      # existed, so the step failed outright (runs on c8cd86e and e05b628) and
      # every step after it was skipped. It is left out rather than left in
      # looking load-bearing.
      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
