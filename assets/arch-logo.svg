<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 520 430"
  role="img"
  aria-labelledby="title desc"
>
  <title id="title">Arch Linux ASCII logo</title>
  <desc id="desc">An Arch Linux logo rendered as blue ASCII art.</desc>

  <text
    x="50%"
    y="30"
    text-anchor="middle"
    font-family="monospace"
    font-size="20"
    font-weight="600"
    fill="#1793d1"
    xml:space="preserve"
  >
    <tspan x="50%" dy="0">                   -`</tspan>
    <tspan x="50%" dy="22">                  .o+`</tspan>
    <tspan x="50%" dy="22">                 `ooo/</tspan>
    <tspan x="50%" dy="22">                `+oooo:</tspan>
    <tspan x="50%" dy="22">               `+oooooo:</tspan>
    <tspan x="50%" dy="22">               -+oooooo+:</tspan>
    <tspan x="50%" dy="22">             `/:-:++oooo+:</tspan>
    <tspan x="50%" dy="22">            `/++++/+++++++:</tspan>
    <tspan x="50%" dy="22">           `/++++++++++++++:</tspan>
    <tspan x="50%" dy="22">          `/+++ooooooooooooo/`</tspan>
    <tspan x="50%" dy="22">         ./ooosssso++osssssso+`</tspan>
    <tspan x="50%" dy="22">        .oossssso-````/ossssss+`</tspan>
    <tspan x="50%" dy="22">       -osssssso.      :ssssssso.</tspan>
    <tspan x="50%" dy="22">      :osssssss/        osssso+++.</tspan>
    <tspan x="50%" dy="22">     /ossssssss/        +ssssooo/-</tspan>
    <tspan x="50%" dy="22">   `/ossssso+/:-        -:/+osssso+-</tspan>
    <tspan x="50%" dy="22">  `+sso+:-`                 `.-/+oso:</tspan>
    <tspan x="50%" dy="22"> `++:.                           `-/+/</tspan>
    <tspan x="50%" dy="22"> .`                                 `/</tspan>
  </text>
</svg>
