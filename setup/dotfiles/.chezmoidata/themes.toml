# Almost no colour at all. Focus is signalled by brightness rather than by
# hue, which is the whole idea - it is the theme for when the desktop
# should disappear.
#
# # The semantic four are the exception and stay coloured, muted right down.
# # A grey `urgent` is not a signal, and the point of a quiet theme is that
# # the few things which do speak are heard.
[themes.mono]
    bg          = "#0e0e10"
    bar         = "#000000"
    bg_dim      = "#08080a"
    surface     = "#1a1a1e"
    surface_alt = "#26262c"
    muted       = "#8b8b95"
    text        = "#e4e4e8"
    text_dim    = "#a8a8b2"
    accent      = "#e4e4e8"
    secondary   = "#b9b9c4"
    tertiary    = "#45454f"
    ok          = "#7fae7f"
    warning     = "#c3ab6e"
    urgent      = "#c96a6a"
    info        = "#7f9dc0"

