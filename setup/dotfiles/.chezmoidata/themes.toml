# ----------------------------------------------------------------------
# The light themes
# ----------------------------------------------------------------------
#
# These exist because GTK stopped being a reason they could not. The rule used
# to be that every theme here had to be dark, on the grounds that GTK reads
# GTK_THEME once at session start; the actual lever is gtk-3.0/settings.ini,
# which every GTK process reads when it starts, so a light desktop needs no
# re-login. `mode` above is what carries that: it picks the GTK theme, the icon
# set, neovim's `background`, and which section foot writes its colours into.
#
# Designing one is not "invert the dark values". Two floors that a dark palette
# meets without trying have to be aimed at deliberately here:
#
#   * warning and info are the awkward pair. The bright amber and bright blue
#     that read well on near-black measure around 2:1 on near-white, so both go
#     dark - an amber that is nearly brown, a blue that is nearly navy. They
#     still read as amber and blue against the paper; they simply are not the
#     colours a dark theme would use.
#   * tertiary inverts its job. It fills the focused workspace disc with `text`
#     written on top, so on a dark theme it is a mid-dark colour under light
#     text and here it is a light tint under dark text. Taking a dark theme's
#     tertiary across would leave the number invisible rather than merely dim.
#
# The sixteen ANSI colours keep the conventional mapping - the black family
# dark, the white family light - because foot sets `foreground` and `background`
# from `text` and `bg` separately, so the two do not have to be swapped. The one
# that does move is bright_black: it carries comments in the editor, so on a
# light theme it is a mid grey darker than the background rather than a light
# grey brighter than it.

[themes.paper]
description = "Near-black on paper white. No hue at all - the e-ink theme."
mode        = "light"
    bg          = "#f6f6f3"  # paper. Very slightly warm, because a pure #ffffff
                             # page glares under a lamp in a way this does not
    bar         = "#ffffff"  # the bar's base, and the lightest thing on screen.
                             # The stylesheet mixes accent and tertiary into it
                             # exactly as it does on the dark themes; 22% of a
                             # near-black secondary into white is a soft grey
                             # wash rather than the glow it makes over black
    bg_dim      = "#fbfbf9"  # lock screen, and the wallpaper's base colour
    surface     = "#e6e6e1"  # inactive borders, hover
    surface_alt = "#d5d5cf"  # separators
    muted       = "#5c5c58"  # cpu and memory. 6.2:1 against the paper
    text        = "#16161a"  # near-black, not black: 16.7:1 is already past
                             # anything legibility asks for, and true black on
                             # true white is the combination that shimmers
    text_dim    = "#55555b"  # unfocused titles

    accent      = "#16161a"  # focus is black here, the way ink is. This is the
                             # greyscale counterpart to `mono`, and the reason
                             # the theme works: nothing competes with the text
    secondary   = "#45454b"  # secondary emphasis
    tertiary    = "#c9c9c2"  # the focused workspace disc, light with dark text
    ok          = "#2c6e49"  # the semantic four are the only colour in the
    warning     = "#8a5a00"  # theme, which is the whole idea - when something
    urgent      = "#a02020"  # goes amber or red on this desktop it is the only
    info        = "#1a5090"  # coloured thing on screen and impossible to miss

[themes.paper.term]
    black          = "16161a"
    red            = "a02020"
    green          = "2c6e49"
    yellow         = "8a5a00"
    blue           = "1a5090"
    magenta        = "7a3b8f"
    cyan           = "1f6b6e"
    white          = "d5d5cf"
    bright_black   = "6e6e69"  # comments. 4.7:1, dark grey rather than light
    bright_red     = "c04040"
    bright_green   = "3f8a5f"
    bright_yellow  = "a67400"
    bright_blue    = "2f6fb0"
    bright_magenta = "96559f"
    bright_cyan    = "2f8487"
    bright_white   = "fbfbf9"

