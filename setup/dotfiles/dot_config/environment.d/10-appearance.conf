# Appearance and toolkit settings for anything that reads the environment
# rather than asking the compositor: XWayland clients, and applications started
# as user units rather than by sway itself.
#
# sway's own `seat * xcursor_theme` covers the compositor and the windows it
# spawns. This covers the rest, so the cursor does not change size or shape
# depending on how a program happened to be launched.
XCURSOR_THEME=Adwaita
XCURSOR_SIZE=24

# Draw the cursor ourselves rather than handing it to the GPU's cursor plane.
#
# Once 3D acceleration is enabled on a virtio GPU, wlroots starts using the
# hardware cursor plane, and virtio's implementation of it renders the cursor
# upside down. The pointer worked correctly while everything was software
# rendered and inverted the moment acceleration was turned on.
#
# wlroots still honours this in 0.20 and says so in its log: "WLR_NO_HARDWARE_CURSORS
# set, forcing software cursors". The cost is that the cursor is composited
# with the rest of the frame rather than by the display hardware, which is
# unmeasurable here and is what was happening anyway before acceleration.
#
# Set here rather than in the sway config because it has to be in sway's
# environment before sway starts, which means the user manager reads it - so it
# needs a fresh login, not a reload.
WLR_NO_HARDWARE_CURSORS=1

# GTK_THEME is deliberately NOT set here.
#
# It used to be, forcing every GTK application to Adwaita:dark, and it was the
# single reason this desktop could not have a light theme. An environment
# variable is fixed when the process reads it, and environment.d is read when
# the *user manager* starts rather than when the session does - so a theme
# switch could not have moved GTK short of a full re-login, and the repository
# recorded that as the reason light themes were impossible.
#
# The reason did not survive being checked. gtk-3.0/settings.ini is read by each
# GTK process as it starts, and with GTK_THEME unset it is what decides: a GTK
# application launched after a theme switch comes up in the new mode with no
# re-login at all. That file is a template now and follows the theme's `mode`.
#
# Setting it here again would silently pin GTK dark and undo that, without
# breaking anything visibly enough to notice - the dialogs would simply stop
# following the desktop. checks/session.sh checks that it stays unset.

# Run natively on Wayland rather than through XWayland where possible. XWayland
# clients render blurry on a scaled output and miss out on native input
# handling, so this is about correctness as much as appearance.
#
# The Qt list is ordered: try Wayland, fall back to X11 for anything that
# cannot. Window decorations are disabled because sway draws the border.
QT_QPA_PLATFORM=wayland;xcb
QT_WAYLAND_DISABLE_WINDOWDECORATION=1
SDL_VIDEODRIVER=wayland
MOZ_ENABLE_WAYLAND=1

# Java applications assume a reparenting window manager and render blank
# windows under sway without this.
_JAVA_AWT_WM_NONREPARENTING=1
