# Stop GTK asking for the accessibility bus.
#
# Nothing here uses a screen reader, but every GTK application in this session -
# waybar, the polkit agent, xdg-desktop-portal-gtk - asks D-Bus for the a11y bus
# address at startup. That activates at-spi-bus-launcher, a second dbus-broker
# and at-spi2-registryd, and the registry lands in a transient unit under
# app.slice. app.slice is not bound to wayland-session@sway.target, so ending the
# graphical session does not stop it: one registryd was left behind by every
# login and they accumulated until reboot (TASK-95).
#
# TWO VARIABLES, BECAUSE GTK3 AND GTK4 DISAGREE, and neither one covers both.
# Measured on this machine by watching the session bus for org.a11y.Bus
# GetAddress calls while starting a real GTK application:
#
#                        GTK3 (gtk-query-settings)   GTK4 (a mapped window)
#   nothing set          asks for the bus            asks for the bus
#   NO_AT_BRIDGE=1       silent                      STILL ASKS
#   GTK_A11Y=none        STILL ASKS                  silent
#   both                 silent                      silent
#
# So either variable on its own looks like a fix and leaves half the session
# still activating at-spi. GTK4 also only asks once it maps a window - a GTK4
# program that calls gtk_init and creates no widget stays silent either way, so
# testing with such a program reports success for a setting that does nothing.
#
# Read by the user manager, so this takes effect at the next login, not on a
# `sync.sh`. Processes already running keep the environment they started with.
NO_AT_BRIDGE=1
GTK_A11Y=none
