# ~/.local/bin on the session PATH.
#
# WHY THIS IS SEPARATE FROM .zshrc, WHICH ALSO DOES IT
#
# They cover different things, and neither is redundant.
#
# .zshrc puts this directory on PATH for interactive shells, so `theme` and
# `wallpaper` and the rest can be typed by name in a terminal. That is where it
# has always been, and it stays.
#
# But sway, rofi, waybar and every desktop entry are not interactive shells.
# They inherit the systemd user manager's environment, which is built from this
# directory - and it did not include ~/.local/bin. The consequence was invisible
# rather than annoying: a launcher entry naming a helper by bare name resolved
# when tested from a terminal and did nothing at all when clicked, because
# nothing reports a command that cannot be found.
#
# That has been worked around twice already, by writing absolute paths into
# notification-centre.desktop and into the waybar config, and both remain
# correct - an absolute path is unambiguous and does not depend on this file.
# What could not be worked around is glib: when a Terminal=true desktop entry
# needs a terminal, glib looks for a program called xdg-terminal-exec on PATH
# and there is no way to hand it an absolute path instead. Ours lives in
# ~/.local/bin, so without this line it is never found and every Terminal=true
# entry - the editor, the file manager - silently opens nothing.
#
# WHAT IT DOES NOT DO
#
# It does not affect a login shell's PATH, which comes from /etc/profile, and it
# is not read by anything started outside the user session. environment.d is
# read when the user manager starts, so a change here needs a fresh login rather
# than a sync - which is why checks/session.sh looks at the running session's
# PATH rather than at this file.
PATH=$HOME/.local/bin:$PATH
