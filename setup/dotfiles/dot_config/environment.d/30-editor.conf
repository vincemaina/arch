# The editor, for everything that asks the environment which one to use - git
# for commit messages, systemctl edit, and anything else honouring the
# convention. Both were unset, so those fell back to whatever the tool's own
# default was rather than to the editor this system has chosen.
#
# VISUAL as well as EDITOR because the two mean different things: EDITOR is
# meant to be usable on a dumb terminal and VISUAL a full-screen one. Nothing
# here is running on a teletype, so they are the same, but a tool that consults
# only one of them should not get a different answer.
EDITOR=nvim
VISUAL=nvim
