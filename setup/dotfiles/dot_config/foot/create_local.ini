# foot settings for this machine only.
#
# Created once and never rewritten; nothing here is tracked. Loaded LAST, so a
# setting here overrides the same setting in the managed foot.ini - including
# its [colors-dark], [bell] and [key-bindings] sections.
#
# Declare whichever sections you need, for example:
#
#     [main]
#     pad=8x8
#
# Font size is NOT the thing to set here. It is shared with the bar, the
# launcher and window titles, so it lives as a value instead:
#
#     python3 ~/.local/lib/desktop_config.py set data.font.terminal 15
#
# Check it with `foot --check-config` before opening a new terminal. An
# already-running foot keeps its config until it restarts.
