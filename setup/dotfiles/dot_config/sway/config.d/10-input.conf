# Input devices.
#
# Identifiers come from `swaymsg -t get_inputs`; type:<x> applies to every
# device of that kind, and matches nothing when no such device exists - so the
# touchpad block below is simply inert on a desktop or a VM.

input type:keyboard {
    # US (ANSI), not GB. The hardware this is typed on is moving to ANSI
    # keyboards, and the layout was moved first on purpose: what is being
    # retrained is muscle memory, and the only way to retrain it is to type on
    # it. Changing the layout at the moment the hardware arrives would put both
    # changes on the same day.
    #
    # Worth knowing that this line is the only place a layout is declared on
    # this machine, and it covers fewer contexts than it looks like it does.
    # The text console gets its own from /etc/vconsole.conf, written once at
    # install time from KEYMAP in setup/install.conf - so that file has to be
    # kept in agreement by hand, and sync.sh has no path for it. The greeter is
    # a third context and declares nothing at all: greetd runs cage/regreet
    # with no XKB variables set, so libxkbcommon's own default applies there -
    # which is `us`. That means the login screen and the session disagreed
    # about every symbol key for as long as this said `gb`; the change closes
    # that gap rather than opening one.
    #
    # Unlike the Alt/Control swap, this cannot move down to keyd: keyd remaps
    # scancodes, and a layout is the mapping from scancode to symbol that sits
    # above it.
    xkb_layout us

    # The defaults are 600ms before repeat and 25 per second, which are tuned
    # for not repeating by accident. On a keyboard-driven desktop the cost is
    # paid constantly: holding a direction key to move through a list, or
    # backspace through a line, feels like waiting.
    #
    # 250ms is long enough not to fire on a deliberate single press, and 40 per
    # second is fast without overshooting the thing you were aiming at.
    repeat_delay 250
    repeat_rate 40
}

input type:touchpad {
    tap enabled
    natural_scroll enabled
    dwt enabled              # disable while typing, stops the palm-brush jump
    middle_emulation enabled
}

seat * {
    # Adwaita is what GTK applications expect, so using it everywhere avoids the
    # cursor changing appearance as the pointer crosses between windows.
    xcursor_theme Adwaita 24

    # Hide the pointer while typing. It is otherwise left sitting over the text
    # being written, which is exactly where it is least wanted.
    hide_cursor when-typing enable
}

# Move the pointer to whatever gains focus.
#
# WHY, AND IT IS NOT ABOUT THE MOUSE
#
# The Caps Lock scroll layer (see setup/system/keyd/default.conf) sends real
# mouse wheel events, because a wheel event is the only thing that scrolls a
# view rather than moving a caret when the cursor is inside a text field - which
# is the case the feature exists for.
#
# But a wheel event is delivered to the surface under the POINTER, and ignores
# keyboard focus entirely. With sway's default `mouse_warping output` the
# pointer only follows focus between outputs, so on a single screen it sat
# wherever it was last left and Caps Lock+j scrolled whatever happened to be
# underneath it rather than the window being worked in.
#
# `container` warps the pointer to the middle of the focused container instead,
# so the two agree and scrolling goes where typing goes.
#
# The cost is that the pointer moves on every focus change. On a keyboard-driven
# desktop that is close to free - the pointer is not being aimed at anything
# between focus changes, and `hide_cursor when-typing` above keeps it out of the
# way once typing starts.
mouse_warping container
