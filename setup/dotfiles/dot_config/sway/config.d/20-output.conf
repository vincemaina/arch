# Outputs.
#
# Names come from `swaymsg -t get_outputs`. `output *` applies everywhere,
# which is all this setup needs while it targets a single display.

# The background is set in 30-appearance.conf, since it is a colour choice
# rather than a display topology one.

# Before setting `scale` on an output, know what it does to X11 clients.
#
# XWayland has no HiDPI support in sway - sway-output(5) says so outright:
# "HiDPI isn't supported with Xwayland clients (windows will blur)". An X11
# client renders at the unscaled size and the compositor scales its buffer up,
# so at scale 2 it is drawing at half resolution. Measured on a headless output
# at 1280x800 scale 2, the same GTK application looked visibly softer through
# XWayland than natively, and picked up different icons besides.
#
# There is no setting that fixes it. What there is:
#
#   * scale_filter, left at the default `smart`, which uses nearest-neighbour
#     at integer scales - sharp but chunky - and linear at fractional ones.
#     Worth knowing if a fractional scale is ever set: linear is the blurrier
#     of the two, and `nearest` trades blur for blockiness.
#
#   * Keeping applications off XWayland in the first place, which is what
#     10-appearance.conf in environment.d is for. Nothing this setup installs
#     needs XWayland today, so the limitation currently costs nothing.
#
# See the "XWayland and scaled outputs" entry in DECISIONS.md.

# QEMU picks 1280x800 despite advertising modes up to 5120x2160, which leaves a
# virtual machine with roughly half the usable screen of a real one. 1920x1080
# at scale 1 is the sweet spot here: more than twice the pixels, no scaling, and
# so none of the XWayland blur that a scaled output brings - see "XWayland and
# scaled outputs" in DECISIONS.md.
#
# Named rather than `output *`, and that is the whole point. Only a QEMU guest
# has an output called Virtual-1; physical machines have eDP-1, DP-1 or
# HDMI-A-1. So this line fixes the one display that is actually wrong and is
# silently inert everywhere else, where sway's own preferred-mode detection is
# already correct. A wildcard here would force 1920x1080 onto a laptop panel
# that wants something different.
output Virtual-1 resolution 1920x1080
