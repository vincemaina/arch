# Window rules.
#
# `for_window` and `assign` rules belong here, so that the behaviour of a
# particular application is described in one place rather than scattered
# through the keybindings.
#
# Match criteria come from `swaymsg -t get_tree`. app_id is the Wayland one
# and is what native clients set; class is the X11 equivalent and only exists
# for XWayland clients.

# Floating by default: things you open, glance at and close.
#
# Tiling is right for windows you work in for a while. It is wrong for a
# transient one, which shoves every other window aside to make room and then
# leaves a gap when it goes. An image viewer is glance-and-close, so it floats.
#
# There was a thunar rule here too, until TASK-44 removed thunar. It had been
# floating a window nothing on this desktop could open: no binding, no click, no
# desktop entry, and the directory handler is terminal-here.desktop. A rule for
# a window that cannot appear is the quietest kind of dead configuration - it
# never fires, so it never looks wrong.
for_window [app_id="imv"] floating enable

# The explorers and the browser, on $mod+e, $mod+Ctrl+e and $mod+b.
#
# Two file managers while TASK-190 decides between them, and they get the SAME
# geometry on purpose - the same reasoning as vimb and qutebrowser below. If
# one opened bigger than the other the comparison would partly be measuring
# that rather than the program.
#
# `thunar` is GTK's own derived app_id, not something Thunar was told to use:
# it takes no app_id flag and its desktop entry has no StartupWMClass. Read
# from `swaymsg -t get_tree` with a window open. This string ties three places
# together - the launcher in sway/config, this rule, and ~/.local/bin/shortcuts
# - and when they disagree the window simply tiles and nothing complains.
for_window [app_id="thunar"] floating enable
for_window [app_id="thunar"] resize set 1100 700
# The terminal one, launched with a distinct app_id so this rule floats it
# without floating every other terminal.
for_window [app_id="explorer"] floating enable
for_window [app_id="explorer"] resize set 1100 700
# firefox is the browser $mod+b opens, since TASK-183. It gets the same
# treatment the other two already had rather than a new one: a browser opening
# floating at 1500x900 is what this desktop has always done, and making the
# default browser the exception would be the surprise.
#
# `firefox` is GTK's app_id here, read out of `swaymsg -t get_tree` with a
# window open rather than assumed - firefox.desktop declares
# StartupWMClass=firefox and agrees, but the tree is what sway matches on.
for_window [app_id="firefox"] floating enable
for_window [app_id="firefox"] resize set 1500 900
for_window [app_id="org.qutebrowser.qutebrowser"] floating enable
for_window [app_id="org.qutebrowser.qutebrowser"] resize set 1500 900
# vimb got the same geometry while it was on trial against qutebrowser
# (TASK-178), so the two were compared on how they felt rather than on one of
# them opening a different size. Kept, now that all three match.
for_window [app_id="vimb"] floating enable
for_window [app_id="vimb"] resize set 1500 900

# Floating terminals - `terminal --floating`, and `terminal` opened from a
# floating window. Floating and centred so it reads as a card over the desktop
# rather than claiming half the screen as a tile.
#
# No `resize set`, deliberately: size comes from foot in characters, derived
# from the font metrics, so the window already fits its contents.
#
# Position IS set here. It used to come from sway-place-floating, a helper that
# scored candidate positions by how much they overlapped what was already
# floating and put the window in the emptiest one, so a second card would not
# land exactly on top of the first. It worked, and it felt glitchy: the window
# appeared centred and then moved, because placement can only happen after the
# window exists. Centring costs little in exchange - two of these on the same
# workspace happens only if one is opened deliberately - so it is centred, and
# it does not move. TASK-54.
#
# There used to be a second floating app_id here, `greeting`, for a terminal
# that opened itself on login and on every empty workspace. TASK-113 removed
# it: landing on a workspace with a terminal you did not ask for stopped being
# useful and started being annoying. `swaymsg [app_id="greeting"] kill` had
# also closed the terminal being worked in more than once, because the
# selector names a category and you can be standing in it - see the
# scripting-traps skill. One app_id, `floating-term`, is what remains.
for_window [app_id="floating-term"] floating enable
for_window [app_id="floating-term"] move position center

# Dialogs, from any application. A file chooser or a confirmation prompt is
# transient by definition, and tiling one is always wrong.
for_window [window_role="dialog"] floating enable
for_window [window_type="dialog"] floating enable

# The password prompt makes a noise. TASK-143.
#
# A polkit dialog is the one window on this desktop that is not a response to
# something you just did: a process has stopped and is waiting for you, and it
# will wait forever. That is worth interrupting for, so it gets `alert` - two
# rising notes, and the loudest of the four sounds by some way. See
# ~/.local/bin/sounds for what the set is and why.
#
# `for_window ... exec` is not a common form and it was verified rather than
# assumed: sway accepts exec in a command list, and the rule fires on the
# window appearing. So this needs no daemon subscribed to window events, which
# was the other way to do it and would have been a fifth thing in the session
# to supervise.
#
# The app_id was measured, not guessed - `swaymsg -t get_tree` with a prompt
# open. It is the same coupling the note further down describes: polkit-gnome
# sets it, this matches it, and nothing else notices if they disagree. If the
# authentication agent is ever changed, this line goes silently dead.
#
# Note this deliberately does NOT fire for the two rules above it. Ordinary
# dialogs - a file chooser, a save prompt - are opened BY you, a fraction of a
# second after you asked for them, and a sound announcing a window you are
# already looking at is noise.
for_window [app_id="polkit-gnome-authentication-agent-1"] exec ~/.local/bin/play-sound alert

# Windows opened by clicking the bar.
#
# Each of these is a glance-and-close window, so the reasoning above applies:
# tiling one would shove the workspace around to make room for something being
# looked at for ten seconds.
#
# The app_id is the coupling to watch. It is set by the command in the waybar
# config, matched by sway-toggle-window to decide whether the window is already
# open, and matched here to float it. All three have to agree, and nothing
# checks that they do except the window appearing in the wrong place.

# The calendar, from clicking the clock. No resize: foot is given a size in
# characters, so the window already fits the three months exactly.
for_window [app_id="calendar"] floating enable

# btop, from clicking cpu or memory. Both readings open this same window
# deliberately - btop shows both, so a second copy would be a second copy of
# the same program.
for_window [app_id="monitor"] floating enable
for_window [app_id="monitor"] resize set 1200 750

# nmtui, from clicking the network module. Smaller: it is a menu, not a
# dashboard, and sizing it like one leaves it mostly empty.
for_window [app_id="network-tui"] floating enable
for_window [app_id="network-tui"] resize set 900 600

# bluetoothctl, from "Pair a new device" in the bluetooth menu. Sized like
# nmtui above for the same reason - it is a prompt you type four commands into,
# not something to be read - but a little taller, because a scan scrolls and the
# device you are looking for is in that list.
for_window [app_id="bluetooth-tui"] floating enable
for_window [app_id="bluetooth-tui"] resize set 900 700

# The shortcut panel, from $mod+? or the launcher.
#
# Floating and parked bottom-right, because it is a reference you glance at
# while working in something else - tiled, it would take space from the thing
# it is describing. It is a normal window though, so $mod+Shift+space tiles it
# if that is what you want on a given day.
#
# It follows focus, and floating is what makes that useful: it stays visible
# while the window it is describing has the keyboard.
for_window [app_id="shortcuts"] floating enable
for_window [app_id="shortcuts"] sticky enable
for_window [app_id="shortcuts"] move position 65 ppt 60 ppt
