# Window rules.
#
# `for_window` and `assign` rules belong here, so that the behaviour of a
# particular application is described in one place rather than scattered
# through the keybindings.
#
# Match criteria come from `swaymsg -t get_tree`. app_id is the Wayland one
# and is what native clients set; class is the X11 equivalent and only exists
# for XWayland clients.

# TITLE BARS, FLOATING ONLY
#
# Tiled windows have no title bars - the window list belongs in the bar, not
# repeated above every window. Floating ones do: they overlap, they move, and a
# bar gives them something to grab and a name to tell them apart by.
#
# `border normal` is chained onto each rule that floats rather than set once
# with `default_floating_border`, and that is not a style choice. Those two
# reach different windows. default_floating_border applies to windows that
# *start* floating - dialogs an application opens that way - while everything
# here starts tiled and is floated a moment later by these rules, so it has
# already taken the tiled default by then. Tried and measured: with only
# default_floating_border set, every window below still came up `border=pixel`.
#
# A catch-all `for_window [floating] border normal` does not work either, for
# the same reason: criteria are evaluated when the window appears, before the
# `floating enable` above it has run, so nothing matches.

# Floating by default: things you open, glance at and close.
#
# Tiling is right for windows you work in for a while. It is wrong for a
# transient one, which shoves every other window aside to make room and then
# leaves a gap when it goes. A file manager and an image viewer are both
# glance-and-close, so they float.
for_window [app_id="thunar"] floating enable, border normal 4
for_window [app_id="imv"] floating enable, border normal 4

# The explorer and the browser, on $mod+e and $mod+b. The explorer is a
# terminal running yazi, launched with a distinct app_id so this rule floats it
# without floating every other terminal.
for_window [app_id="explorer"] floating enable, border normal 4
for_window [app_id="explorer"] resize set 1100 700
for_window [app_id="org.qutebrowser.qutebrowser"] floating enable, border normal 4
for_window [app_id="org.qutebrowser.qutebrowser"] resize set 1500 900

# The login greeting, from greeting.service. Floating and centred so it reads
# as a card over the desktop rather than claiming half the screen as a tile.
#
# No `resize set` and no `move position center` here, deliberately. Size comes
# from foot in characters, derived from the font metrics, so the window already
# fits its contents. Position comes from sway-place-floating, which puts the
# window where there is room - centring everything means two floating terminals
# land on exactly the same spot and cannot be told apart. sway cannot express
# either: for_window takes fixed values and cannot measure anything.
for_window [app_id="greeting"] floating enable, border normal 4

# Dialogs, from any application. A file chooser or a confirmation prompt is
# transient by definition, and tiling one is always wrong.
for_window [window_role="dialog"] floating enable, border normal 4
for_window [window_type="dialog"] floating enable, border normal 4

# For windows that open floating of their own accord, which the rules above
# never see.
default_floating_border normal 4
