# Keybindings.
#
# The organising principle, which every addition here has to answer to:
#
#   $mod is for window management. Nothing else may take a $mod chord.
#   One binding per action. If there are two ways to do a thing, one goes.
#
# Three applications get a binding: the terminal, the browser and the file
# explorer. Everything else is launched from $mod+space.
#
# This reverses an earlier decision, and the reversal is deliberate rather than
# forgetful. $mod+b and $mod+e were a browser and a file manager once; they
# were taken back because they had shadowed splith and layout-toggle, and the
# rule became "applications get no bindings at all".
#
# What changed is that autotiling now chooses the split direction from the
# shape of the focused container, so splith and splitv are no longer commands
# anyone reaches for - the thing the letters were being protected for stopped
# needing protecting. The three that keep a binding are the ones opened many
# times a day; the argument that the launcher costs only one extra keystroke is
# exactly why everything else still uses it.
#
# Mode entry bindings live with their mode in 51-modes.conf; hardware keys
# live in 52-media-keys.conf. Everything else is here.

# Drag floating windows with $mod + left mouse, resize with right mouse.
# Also works on tiled windows despite the name.
floating_modifier $mod normal

# $mod and the scroll wheel resizes the focused window, both dimensions at once.
#
# floating_modifier above already gives $mod+right-drag, which is precise and
# wants a hand on the mouse and an eye on the corner. This is the coarse
# version: a few clicks to make something bigger without aiming at anything.
#
# PIXELS, NOT PERCENTAGE POINTS, and that is the whole reason it is written this
# way. Measured on a probe window rather than assumed:
#
#   floating   ppt does NOTHING at all; px works     702x506 -> 798x578
#   tiled      both work                             942 -> 1042 (px)
#
# So px is the only unit serving both. A binding using ppt would have looked
# right, worked in a tiled layout, and silently done nothing on every floating
# window - which is most of the windows on this desktop.
#
# 64x36 is 16:9, so a window keeps roughly its shape as it grows rather than
# creeping towards square over a few clicks. About 8% of a floating terminal's
# width per click: noticeable, and not so large that two clicks overshoot.
#
# --whole-window because the default is the border only, which would mean aiming
# at a 3px edge for a gesture whose entire point is not having to aim.
#
# A lone tiled window has no sibling to take space from, so this correctly does
# nothing there. That is sway's model rather than a failure.
#
# No --no-repeat: a pointer button cannot repeat. sway(5) repeats a binding
# "according to the repeat settings specified in the input configuration",
# which is keyboard repeat_rate; a wheel emits discrete clicks. checks/
# sway-bindings.sh knows this now rather than demanding a meaningless flag.
#
# ON $mod+Shift RATHER THAN BARE $mod, AND WHY BOTH THIS AND THE KEYBOARD EXIST
#
# Two ways to do one thing is normally the thing this file argues against, and
# this is a deliberate exception rather than an oversight. Resizing and
# rearranging windows is a SPATIAL task, and spatial tasks suit a pointer;
# every other window operation here is a discrete one and suits a key. Both
# hands should be able to do it, so both can.
#
# The modifier matches the keyboard pair below on purpose: $mod+Shift is
# already "act on this window" - $mod+Shift+h/j/k/l moves it - so one posture
# now covers moving and sizing whether you finish the gesture with a key or
# with the wheel. Bare $mod+scroll was where this started and has been given
# to workspace stepping instead, further down.
bindsym --whole-window $mod+Shift+button4 resize grow width 64 px, resize grow height 36 px
bindsym --whole-window $mod+Shift+button5 resize shrink width 64 px, resize shrink height 36 px

# The keyboard version of the same gesture, on $mod+Shift+equal (+) to grow and
# $mod+Shift+minus (-) to shrink - the same sense "+"/"-" already carry for
# zoom, so there is nothing new to learn about which key does which.
#
# WHY $mod+Shift AND NOT BARE $mod, WHICH IS SHORTER
#
# Because of what you are doing while you resize. Moving a window is
# $mod+Shift+h/j/k/l, and arranging a layout means moving and sizing in the
# same breath. On $mod+Shift the whole operation happens with one hand posture
# held down; on bare $mod it means releasing Shift between every pair of
# actions. The shorter chord would have been cheaper to press once and more
# expensive to actually use.
#
# The shifted keysym is not a problem here, in case it looks like one:
# `bindsym $mod+Shift+minus move scratchpad` is sway's own shipped default in
# /etc/sway/config, so a plain bindsym matches these regardless of the fact
# that Shift+equal produces `plus`. No --to-code is needed.
#
# This leaves bare $mod+equal and $mod+minus unbound and available.
#
# Same 64x36 px step as the wheel above, for the same reason: keeps the
# window's shape rather than creeping square, and px is the only unit that
# also works on floating windows (see the comment above).
#
# No --whole-window: that flag is documented as mouse-only, affecting which
# part of a window a pointer binding fires over. It has no meaning for a
# keysym, and sway(5) does not list it as one of that command's options.
#
# This DOES repeat, unlike the wheel binding above - and unlike almost
# everything else in this file. A wheel click cannot repeat at all, so that
# binding's lack of --no-repeat says nothing about intent. This one is a
# genuine, deliberate choice, made the same way the resize mode below already
# makes it: `bindsym $left resize shrink width 10px` in the "resize" mode has
# no --no-repeat either, because one press of a fixed step is rarely the
# amount wanted and holding the key to keep going is the whole point - the
# identical argument that puts $mod+Shift+h/j/k/l on the repeat whitelist.
# checks/sway-bindings.sh enforces the whitelist, so both combos are listed
# there with this same reasoning.
bindsym $mod+Shift+equal resize grow width 64 px, resize grow height 36 px
bindsym $mod+Shift+minus resize shrink width 64 px, resize shrink height 36 px

### Session

# KEY REPEAT IS OFF BY DEFAULT HERE, AND ON BY EXCEPTION.
#
# The input config sets repeat_delay 250 and repeat_rate 40, which is snappy on
# purpose and indiscriminate by default: sway repeats a binding for as long as
# the key is held unless --no-repeat says otherwise. At 40 a second that turns
# a fractionally-long press on $mod+q into every window on the workspace being
# closed, which is not a theoretical risk - it is what prompted this.
#
# So every binding in these files carries --no-repeat except a short whitelist
# where holding the key IS the gesture:
#
#   $mod+Shift+h/j/k/l    nudging a window; in floating mode that is pixels,
#                         so one press is never enough
#   h/j/k/l in resize     the same argument
#   volume and brightness holding them is how everyone expects them to behave
#
# Everything else is a discrete act - launch, kill, toggle, switch, screenshot -
# and repeating a discrete act is never what was meant.
#
# Focus movement is deliberately NOT on the list. It is not destructive, but it
# is discrete: at this repeat rate holding $mod+l overshoots the window you
# wanted. Add it here if that proves wrong in use.
#
# checks/sway-bindings.sh enforces this, so a binding added without --no-repeat
# fails rather than quietly becoming repeatable.

bindsym --no-repeat $mod+Return exec $term
bindsym --no-repeat $mod+b exec $browser
bindsym --no-repeat $mod+e exec $explorer
# The git interface, beside the explorer and the browser because it is the same
# kind of thing: a tool you open on the thing you are already looking at. It
# resolves the focused window's directory rather than starting in $HOME, which
# is not a repository - see ~/.local/bin/git-ui.
bindsym --no-repeat $mod+g exec ~/.local/bin/git-ui
# Closing a window is frequent enough to be a bare chord. Note the asymmetry
# with the session bindings below, which keep Shift precisely because they are
# not frequent and are worth being slightly awkward.
bindsym --no-repeat $mod+q kill
bindsym --no-repeat $mod+space exec $menu
bindsym --no-repeat $mod+Shift+c reload
# The power menu - log out, restart, suspend, power off. Replaces what used to
# be a swaynag prompt asking only "exit sway?"; that prompt's whole reasoning
# (one wrong keystroke should not end the session) is carried forward into the
# menu itself, which still confirms before doing anything destructive. See
# ~/.local/bin/power-menu.
bindsym --no-repeat $mod+Shift+e exec ~/.local/bin/power-menu

### Focus

bindsym --no-repeat $mod+$left focus left
bindsym --no-repeat $mod+$down focus down
bindsym --no-repeat $mod+$up focus up
bindsym --no-repeat $mod+$right focus right

bindsym --no-repeat $mod+a focus parent

### Moving windows

bindsym $mod+Shift+$left move left
bindsym $mod+Shift+$down move down
bindsym $mod+Shift+$up move up
bindsym $mod+Shift+$right move right

### Layout

# splith, splitv, layout toggle and layout tabbed all used to live here on
# $mod+b, $mod+v, $mod+e and $mod+w. autotiling picks the split direction now,
# so the first two had nothing left to do and the letters went to the browser
# and the explorer.
#
# splith and splitv are genuinely gone: autotiling picks the direction.
#
# Tabbed is NOT: it stacks several windows into one space, which is a different
# thing from choosing a direction, and autotiling does not provide it. Removing
# it outright was a mistake worth recording, because it took the way *out* with
# it - a container already in tabbed layout had no command left that could
# return it to a split, and there is no way to tell from looking that the fix
# is a layout command rather than something wrong with the window.
#
# One binding covers both directions now, which is fewer than the two it
# replaces: $mod+t cycles the focused container between split and tabbed.
bindsym --no-repeat $mod+t layout toggle split tabbed

bindsym --no-repeat $mod+f fullscreen
# Not a bare `floating toggle`: the border has to change with it, or a window
# ends up tiled with a title bar or floating without one. See the script.
bindsym --no-repeat $mod+Shift+space exec ~/.local/bin/sway-toggle-floating

# What can I do here? $mod+? opens the shortcut reference, on the tab matching
# whatever window is focused - because the question is almost never "list every
# shortcut", it is "what works in the thing I am looking at".
#
# Shift+question rather than a letter: it is the key that already means "help"
# on most things, and it costs no letter from the small supply $mod has.
bindsym --no-repeat $mod+Shift+slash exec ~/.local/bin/shortcuts

# Move focus between the tiled windows and the floating ones.
#
# Different from $mod+Shift+space above, which *makes* a window float. This
# changes which layer you are looking at: from the tiles to whatever is floating
# over them, and back to where you were. sway does it natively with
# `focus mode_toggle`, so there is nothing to script.
#
# Ctrl+Tab, deliberately taken globally, and it has a cost worth knowing. A sway
# binding is seen by sway and never reaches the application, and qutebrowser
# binds Ctrl+Tab itself to `tab-focus last` - the same gesture one level down.
# So the browser loses its tab alternation to give windows theirs. That was the
# explicit decision; sway has no per-application exclusion, so it is one or the
# other.
#
# Reachable because of TASK-40: Control is the key beside the space bar now, so
# this is a thumb-and-finger chord rather than a stretch.
bindsym --no-repeat Ctrl+Tab focus mode_toggle

### The bar

# Hide the bar, and give its strip back to the windows. Same key again brings
# it back.
#
# A $mod chord rather than an application-style one, because the bar is part of
# the frame this file is for, not a program. Shift because it is infrequent -
# the same argument that keeps reload and exit on Shift while kill and the
# launcher stay bare.
#
# The whole test of this is whether the *windows* change, not whether the bar
# disappears: waybar reserves its strip with a layer-shell exclusive zone, and a
# surface drawn empty that still holds the zone leaves the gap behind and looks
# exactly the same. See the script, which also explains why it signals waybar
# rather than stopping it.
bindsym --no-repeat $mod+Shift+b exec ~/.local/bin/sway-toggle-bar # Hide or show the bar

### Workspaces

bindsym --no-repeat $mod+1 workspace number 1
bindsym --no-repeat $mod+2 workspace number 2
bindsym --no-repeat $mod+3 workspace number 3
bindsym --no-repeat $mod+4 workspace number 4
bindsym --no-repeat $mod+5 workspace number 5
bindsym --no-repeat $mod+6 workspace number 6
bindsym --no-repeat $mod+7 workspace number 7
bindsym --no-repeat $mod+8 workspace number 8
bindsym --no-repeat $mod+9 workspace number 9
bindsym --no-repeat $mod+0 workspace number 10

bindsym --no-repeat $mod+Shift+1 move container to workspace number 1
bindsym --no-repeat $mod+Shift+2 move container to workspace number 2
bindsym --no-repeat $mod+Shift+3 move container to workspace number 3
bindsym --no-repeat $mod+Shift+4 move container to workspace number 4
bindsym --no-repeat $mod+Shift+5 move container to workspace number 5
bindsym --no-repeat $mod+Shift+6 move container to workspace number 6
bindsym --no-repeat $mod+Shift+7 move container to workspace number 7
bindsym --no-repeat $mod+Shift+8 move container to workspace number 8
bindsym --no-repeat $mod+Shift+9 move container to workspace number 9
bindsym --no-repeat $mod+Shift+0 move container to workspace number 10

# Relative workspace movement, on $mod+Ctrl. The modifier says what is being
# moved through: bare $mod moves between windows, $mod+Ctrl between workspaces.
# The number row still reaches a workspace directly, and remains the only way
# to send a window to one, so the two do not fully overlap.
#
# There are now three ways to reach the workspace next door - the number row,
# these, and $mod+scroll below - and that is not the violation it looks like.
# The rule is not "one binding per action"; it is that nothing exists without a
# reason. The number row is exact but a stretch, these are on the home row for
# stepping without looking, and the wheel is there because stepping is a
# spatial motion and spatial motions suit a pointer. See "nothing exists just
# because" in DECISIONS.md.
#
# Reachable rather than clever: since keyd swapped left Alt and left Control,
# Ctrl is the key beside the space bar, so these are thumb-and-home-row. The
# number row was the original complaint and it is a genuine stretch.
#
# _on_output rather than plain prev/next: workspaces belong to one output and
# that is settled - see "Workspaces stay per-output, as sway does them" in
# DECISIONS.md - so stepping should stay on the screen you are looking at.
# The two behave identically on a single display and differ on two.
bindsym --no-repeat $mod+Ctrl+h workspace prev_on_output
bindsym --no-repeat $mod+Ctrl+l workspace next_on_output

# The same step, on the wheel. $mod+scroll was resizing until resize moved to
# $mod+Shift to match its keyboard pair, and stepping workspaces is the
# obvious thing to leave in a slot that costs one modifier: it is frequent,
# and it is the other motion you make without looking.
#
# Up is previous and down is next, matching h and l above rather than the
# scrollbar metaphor - these are the same two commands, so they should not
# disagree about which direction is which.
#
# _on_output for the same reason as above, and note what "next" means: sway
# steps through the workspaces that EXIST, not 1 to 10. Ten are bound but a
# workspace is created when first used and destroyed when its last window
# closes, so the wheel visits three of them on a machine with three in use.
#
# --whole-window because the default is the border only. No --no-repeat: a
# pointer button cannot repeat, and checks/sway-bindings.sh knows that.
bindsym --whole-window $mod+button4 workspace prev_on_output
bindsym --whole-window $mod+button5 workspace next_on_output

# The exception in the cluster, and the reason for this comment: j is not
# "down". It is the toggle back to wherever you just were, given the best key
# because it is the most frequent move, and sat between h and l so the
# directions flank it. Everything else here is derivable; this one is learned.
#
# It replaces $mod+Tab, which was the previous binding for this. Tab was given
# up deliberately: it means "switch window" everywhere else in computing, and
# applications sometimes want it.
bindsym --no-repeat $mod+Ctrl+j workspace back_and_forth

# Notifications have no binding of their own, deliberately. Type "notifications"
# into $mod+space and it is there, because dot_local/share/applications carries
# a desktop entry for it - which is all it takes for the launcher to find
# anything. One thing to remember rather than one per tool, and the same route
# works for whatever gets added next.

### Clipboard

# Everything you have copied, text and pictures alike, in the launcher's own
# list. Enter puts the entry back on the clipboard; it does not paste it for
# you, and ~/.local/bin/clipboard-history explains why at the bottom.
#
# THIS IS AN EXCEPTION TO THE RULE AT THE TOP OF THIS FILE, and it is worth
# saying why rather than letting the count of exceptions creep. $mod is for
# window management and everything else goes through $mod+space - which is
# exactly the argument the notification centre lost, one paragraph above.
#
# The difference is frequency and interruption. Notifications are something you
# go and look at; the clipboard is something you reach for in the middle of
# typing, several times an hour, and the launcher route costs a mode switch
# ($mod+space, type, read, Enter) at the moment you are least able to afford
# one. $mod+v is also the gesture this means on Windows and on every GNOME and
# KDE clipboard manager, so it is one fewer thing to learn rather than one
# more.
#
# v was free: nothing has ever been bound to it here. The desktop entry exists
# as well, so "clipboard" still finds it from $mod+space for anyone who reaches
# that way first.
bindsym --no-repeat $mod+v exec ~/.local/bin/clipboard-history

### Scratchpad

# A bag of holding for windows: send one away, cycle them back later.
#
# This used to live on bare $mod+minus (show) and $mod+Shift+minus (move) -
# sway's own shipped defaults - and lost both to keyboard grow/shrink, on the
# scratchpad's own stated terms. "Prime shortcuts - fewer buttons, more
# natural positions - go to the most-used actions", and grow/shrink is used
# far more than the scratchpad.
#
# So the scratchpad moved down a tier rather than sideways to another equally
# prime key: $mod+Ctrl+minus / $mod+Ctrl+Shift+minus, keeping minus as the
# mnemonic (it is still "the scratchpad key"), the same Shift-for-move pattern
# it always had, but gated behind the extra Ctrl this file already uses
# elsewhere for the second tier - see $mod+Ctrl+h/l/j below, "relative
# workspace movement" bound one notch down from the number row for the same
# reason. Literally more buttons for a less-used action.
#
# Resize has since moved from bare $mod to $mod+Shift, which leaves bare
# $mod+minus free again. The scratchpad is NOT taking it back: half of the
# pair would be prime and half would still be three keys down, and a pair
# that has to be learned as two unrelated chords is worse than a consistent
# one. Bare $mod+minus and $mod+equal are simply unclaimed.
bindsym --no-repeat $mod+Ctrl+Shift+minus move scratchpad
bindsym --no-repeat $mod+Ctrl+minus scratchpad show

### Screenshots

# Called by path rather than name: ~/.local/bin is not guaranteed to be on
# the PATH sway inherits, and a binding that silently does nothing is the
# exact failure this replaced.
bindsym --no-repeat Print exec ~/.local/bin/sway-screenshot screen
bindsym --no-repeat Shift+Print exec ~/.local/bin/sway-screenshot region
bindsym --no-repeat Ctrl+Shift+Print exec ~/.local/bin/sway-screenshot clip
