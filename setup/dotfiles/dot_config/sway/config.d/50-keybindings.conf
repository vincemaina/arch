# Keybindings.
#
# The organising principle, which every addition here has to answer to:
#
#   $mod is for window management. Nothing else may take a $mod chord.
#   One binding per action. If there are two ways to do a thing, one goes.
#
# Applications get no bindings at all. They are launched from the launcher on
# $mod+space, which costs one extra keystroke and in exchange means the $mod
# namespace can never run out and no application can shadow a layout verb. It
# did: $mod+b and $mod+e were a browser and a file manager, which cost the
# split and layout-toggle commands entirely.
#
# The terminal on $mod+Return is the one deliberate exception. It is less an
# application than the thing windows are usually made of.
#
# Mode entry bindings live with their mode in 51-modes.conf; hardware keys
# live in 52-media-keys.conf. Everything else is here.

# Drag floating windows with $mod + left mouse, resize with right mouse.
# Also works on tiled windows despite the name.
floating_modifier $mod normal

### Session

bindsym $mod+Return exec $term
# Closing a window is frequent enough to be a bare chord. Note the asymmetry
# with the session bindings below, which keep Shift precisely because they are
# not frequent and are worth being slightly awkward.
bindsym $mod+q kill
bindsym $mod+space exec $menu
bindsym $mod+Shift+c reload
bindsym $mod+Shift+e exec swaynag -t warning -m 'You pressed the exit shortcut. Do you really want to exit sway? This will end your Wayland session.' -B 'Yes, exit sway' 'swaymsg exit'

### Focus

bindsym $mod+$left focus left
bindsym $mod+$down focus down
bindsym $mod+$up focus up
bindsym $mod+$right focus right

bindsym $mod+a focus parent

### Moving windows

bindsym $mod+Shift+$left move left
bindsym $mod+Shift+$down move down
bindsym $mod+Shift+$up move up
bindsym $mod+Shift+$right move right

### Layout

# Split the focused container. New windows open alongside, in this direction.
bindsym $mod+b splith
bindsym $mod+v splitv

bindsym $mod+e layout toggle split
bindsym $mod+w layout tabbed

bindsym $mod+f fullscreen
bindsym $mod+Shift+space floating toggle

### Workspaces

bindsym $mod+1 workspace number 1
bindsym $mod+2 workspace number 2
bindsym $mod+3 workspace number 3
bindsym $mod+4 workspace number 4
bindsym $mod+5 workspace number 5
bindsym $mod+6 workspace number 6
bindsym $mod+7 workspace number 7
bindsym $mod+8 workspace number 8
bindsym $mod+9 workspace number 9
bindsym $mod+0 workspace number 10

bindsym $mod+Shift+1 move container to workspace number 1
bindsym $mod+Shift+2 move container to workspace number 2
bindsym $mod+Shift+3 move container to workspace number 3
bindsym $mod+Shift+4 move container to workspace number 4
bindsym $mod+Shift+5 move container to workspace number 5
bindsym $mod+Shift+6 move container to workspace number 6
bindsym $mod+Shift+7 move container to workspace number 7
bindsym $mod+Shift+8 move container to workspace number 8
bindsym $mod+Shift+9 move container to workspace number 9
bindsym $mod+Shift+0 move container to workspace number 10

# Relative workspace movement, on $mod+Ctrl. The modifier says what is being
# moved through: bare $mod moves between windows, $mod+Ctrl between workspaces.
# The number row still reaches a workspace directly, and remains the only way
# to send a window to one, so the two do not overlap and the one-binding-per-
# action rule holds without needing an exception.
#
# Reachable rather than clever: since keyd swapped left Alt and left Control,
# Ctrl is the key beside the space bar, so these are thumb-and-home-row. The
# number row was the original complaint and it is a genuine stretch.
#
# _on_output rather than plain prev/next: workspaces belong to one output and
# that is settled - see "Workspaces stay per-output, as sway does them" in
# DECISIONS.md - so stepping should stay on the screen you are looking at.
# The two behave identically on a single display and differ on two.
bindsym $mod+Ctrl+h workspace prev_on_output
bindsym $mod+Ctrl+l workspace next_on_output

# The exception in the cluster, and the reason for this comment: j is not
# "down". It is the toggle back to wherever you just were, given the best key
# because it is the most frequent move, and sat between h and l so the
# directions flank it. Everything else here is derivable; this one is learned.
#
# It replaces $mod+Tab, which was the previous binding for this. Tab was given
# up deliberately: it means "switch window" everywhere else in computing, and
# applications sometimes want it.
bindsym $mod+Ctrl+j workspace back_and_forth

### Scratchpad

# A bag of holding for windows: send one away, cycle them back later.
bindsym $mod+Shift+minus move scratchpad
bindsym $mod+minus scratchpad show

### Screenshots

# Called by path rather than name: ~/.local/bin is not guaranteed to be on
# the PATH sway inherits, and a binding that silently does nothing is the
# exact failure this replaced.
bindsym Print exec ~/.local/bin/sway-screenshot screen
bindsym Shift+Print exec ~/.local/bin/sway-screenshot region
bindsym $mod+Shift+s exec ~/.local/bin/sway-screenshot clip
