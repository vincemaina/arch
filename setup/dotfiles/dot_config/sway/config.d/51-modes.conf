# Modes.
#
# A mode and the binding that enters it are kept together, so a mode can be
# added or removed without touching the general keybindings.

mode "resize" {
    bindsym $left resize shrink width 10px
    bindsym $down resize grow height 10px
    bindsym $up resize shrink height 10px
    bindsym $right resize grow width 10px

    bindsym --no-repeat Return mode "default"
    bindsym --no-repeat Escape mode "default"
}
bindsym --no-repeat $mod+r mode "resize"
