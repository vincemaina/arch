# Hardware media and brightness keys.
#
# --locked keeps these working while the screen is locked, which is the
# point of having them on dedicated keys.

# Volume.
#
# -l 1.0 is the whole point of using wpctl here. pactl set-sink-volume has no
# upper bound, so holding the raise key kept multiplying software gain - this
# machine was found sitting at 105%, and it will go to 2000% if asked. Above
# 100% is digital amplification, which clips the waveform rather than making
# anything louder in a useful way, and sustained clipping is hard on speakers
# and worse on ears.
#
# --limit clamps the result rather than the step, so it also walks an
# already-too-loud machine back down to 100% on the next press.
bindsym --locked XF86AudioMute exec wpctl set-mute \@DEFAULT_AUDIO_SINK@ toggle
bindsym --locked XF86AudioLowerVolume exec wpctl set-volume -l 1.0 \@DEFAULT_AUDIO_SINK@ 5%-
bindsym --locked XF86AudioRaiseVolume exec wpctl set-volume -l 1.0 \@DEFAULT_AUDIO_SINK@ 5%+
bindsym --locked XF86AudioMicMute exec wpctl set-mute \@DEFAULT_AUDIO_SOURCE@ toggle

# Playback
bindsym --locked XF86AudioPlay exec playerctl play-pause
bindsym --locked XF86AudioPause exec playerctl play-pause
bindsym --locked XF86AudioPrev exec playerctl previous
bindsym --locked XF86AudioNext exec playerctl next
bindsym --locked XF86AudioStop exec playerctl stop

# Brightness
bindsym --locked XF86MonBrightnessDown exec brightnessctl set 5%-
bindsym --locked XF86MonBrightnessUp exec brightnessctl set 5%+
