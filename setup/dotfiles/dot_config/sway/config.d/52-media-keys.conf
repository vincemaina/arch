# Hardware media and brightness keys.
#
# --locked keeps these working while the screen is locked, which is the
# point of having them on dedicated keys.

# Volume.
#
# These called wpctl directly until TASK-85, and the wpctl call is still what
# happens - it has just moved into ~/.local/bin/volume, which reads the level
# before stepping it so that a step which would change nothing can make a
# sound instead of failing silently. The reasoning that used to live here has
# moved with it; that file is worth reading before changing these lines.
#
# The short version, because it is the thing most likely to be undone by
# accident: the clamp at 100% is deliberate and load-bearing. pactl has no
# upper bound, this machine was once found sitting at 105%, and above 100% is
# digital amplification that clips rather than getting louder.
bindsym --locked --no-repeat XF86AudioMute exec ~/.local/bin/volume mute
bindsym --locked XF86AudioLowerVolume exec ~/.local/bin/volume down
bindsym --locked XF86AudioRaiseVolume exec ~/.local/bin/volume up
bindsym --locked --no-repeat XF86AudioMicMute exec wpctl set-mute \@DEFAULT_AUDIO_SOURCE@ toggle

# Playback
bindsym --locked --no-repeat XF86AudioPlay exec playerctl play-pause
bindsym --locked --no-repeat XF86AudioPause exec playerctl play-pause
bindsym --locked --no-repeat XF86AudioPrev exec playerctl previous
bindsym --locked --no-repeat XF86AudioNext exec playerctl next
bindsym --locked --no-repeat XF86AudioStop exec playerctl stop

# Brightness
#
# Through a helper for the same reason as the volume keys directly above: at
# either end of the range the key does nothing, and doing nothing silently is
# indistinguishable from being broken. See ~/.local/bin/brightness.
bindsym --locked XF86MonBrightnessDown exec ~/.local/bin/brightness down
bindsym --locked XF86MonBrightnessUp exec ~/.local/bin/brightness up
