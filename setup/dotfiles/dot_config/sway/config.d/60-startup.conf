# Session startup.
#
# Session components are systemd user units rather than sway `exec` lines.
# They live in ~/.config/systemd/user/ and are enabled by symlinks in
# wayland-session@sway.target.wants/ there.
#
# uwsm starts wayland-session@sway.target when the session begins, which pulls
# in the bar, notifications and idle handling, restarts them if they fail,
# and stops them cleanly when the session ends. An `exec` line here would
# get none of that.
#
# Note that this only happens when the session is launched through uwsm.
# A plain `sway` reaches no session target, so nothing would start.
#
# Prefer adding a unit. There is deliberately nothing here.
