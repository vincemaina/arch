# Session startup.
#
# Everything the session needs running alongside the compositor belongs
# here, so there is one place to look for what starts with sway.

# Lock after 5 minutes, blank after 10, and always lock before sleep.
exec swayidle -w \
         timeout 300 'swaylock -f -c 000000' \
         timeout 600 'swaymsg "output * power off"' resume 'swaymsg "output * power on"' \
         before-sleep 'swaylock -f -c 000000'
