# Sway settings for this machine only.
#
# Created once and never rewritten - ./sync.sh will not touch it, and nothing
# here is tracked in the repository. Put anything that belongs to this computer
# rather than to the setup: an output line for a monitor you own, a binding you
# want here and nowhere else, a workaround for hardware nobody else has.
#
# Loaded LAST. sway's config globs config.d/*.conf in name order, and 99 sorts
# after everything the repository ships, so a setting here overrides the same
# setting above it.
#
# Reload with $mod+Shift+c. `swaymsg -t get_config` shows only the top-level
# file, so check a binding took by using it, or with ./checks/sway-bindings.sh.
#
# Anything you would be annoyed to lose when this machine is rebuilt belongs in
# the repository instead - see "Machine-local dotfile changes" in DECISIONS.md.
