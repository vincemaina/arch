# Waybar ships its own unit, so only the parts that conflict with this setup are
# overridden here rather than the whole thing being copied. ExecStart, the
# SIGUSR2 reload and Restart=on-failure all stay as packaged.
#
# The packaged unit is ordered After=graphical-session.target, which is correct
# for a unit that target pulls in. Ours is pulled in by wayland-session@sway.target
# instead, so that sway components do not start under another compositor - and
# uwsm orders graphical-session.target AFTER wayland-session@sway.target. The
# result is a loop:
#
#   graphical-session.target
#     after wayland-session@sway.target
#       after waybar.service
#         after graphical-session.target
#
# systemd breaks such a loop by deleting a job from it, which is why the bar
# silently never started: "Job waybar.service/start deleted to break ordering
# cycle". Resetting the ordering onto the compositor target removes the cycle.
#
# An empty assignment resets an inherited list before the new value is added.

# Restart=always rather than on-failure. A session component has no reason to
# exit at all, so a clean exit is as much a fault as a crash - and `pkill
# waybar` terminates it cleanly, which on-failure does not treat as a failure,
# so the bar stayed dead. An explicit `systemctl --user stop` is still honoured.
[Service]
Restart=always
RestartSec=1

[Unit]
After=
Requisite=
PartOf=
After=wayland-session@sway.target
Requisite=wayland-session@sway.target
PartOf=wayland-session@sway.target
