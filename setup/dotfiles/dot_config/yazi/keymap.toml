# yazi keybindings.
#
# Only additions. prepend_keymap is merged in front of yazi's own defaults
# rather than replacing them, so everything the manual documents still works and
# there is no second copy of the default keymap here to drift.

[mgr]
prepend_keymap = [
    # A terminal in the directory you are currently in.
    #
    # The opener in yazi.toml covers the other half of this: opening a directory
    # you are hovering gives a terminal in *that* one. This is for when you have
    # already navigated somewhere and want a shell where you are standing -
    # which is the more common case, since finding the place is usually why you
    # opened the file manager.
    #
    # WHY THE COMMAND LOOKS LIKE THAT
    #
    # `setsid ... &` rather than yazi's own --orphan flag. The flag may well
    # exist, but it could not be confirmed: yazi does not validate command flags
    # when it loads the keymap - a deliberately invented flag was accepted
    # without complaint - so a wrong one here would fail silently at the moment
    # it was pressed, which is the failure this repository keeps meeting.
    # setsid and a background job are shell features that are certain.
    #
    # foot inherits yazi's working directory, and here that is exactly right:
    # this binding is about where you *are*, so there is no path to pass.
    { on = "T", run = 'shell "setsid foot >/dev/null 2>&1 &"', desc = "Terminal here" },
]
