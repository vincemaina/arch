USERNAME="vincemaina"
HOSTNAME="arch"
TIMEZONE="Europe/London"
LOCALE="en_GB.UTF-8"
KEYMAP="us"

# The git identity, committed on purpose (TASK-37).
#
# Everything above is read by the install stages with `source`. These two are
# read by setup/dotfiles/dot_gitconfig.tmpl instead, which pulls this file in
# with chezmoi's `include` and parses the KEY="value" lines - so this stays the
# one place a machine's identity is written down, and the dotfile does not get
# a second copy of it. Keep the quoting style above; the template matches on it.
#
# Committed rather than prompted, unlike the passwords below. A password is a
# secret and a name and email address are not: this repository's own history
# already publishes both on every commit, so committing them here reveals
# nothing that `git log` does not. Prompting for them would also put the
# question in the one place it cannot be answered twice - the installer - while
# leaving sync.sh with nothing to apply.
GIT_NAME="Vince Maina"
GIT_EMAIL="vchapandrews@gmail.com"

# Passwords are deliberately absent: 03-system.sh asks for them interactively
# and nothing here ever stores one.
