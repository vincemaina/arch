# Early out-of-memory handling. Installed to /etc/default/earlyoom
#
# The kernel OOM killer only acts once the machine is already thrashing, by
# which point the desktop has been unresponsive for a long time. earlyoom
# watches available memory and kills something while the system is still
# usable.
#
# Thresholds are the upstream defaults, set explicitly so they are reviewable:
# warn at 10% available, kill at 5%. earlyoom requires BOTH memory and swap to
# be below their thresholds before killing, which is the behaviour we want
# alongside zram - a full zram device is entirely normal and only signifies
# trouble when available memory is low as well.
#
# --avoid protects the session itself: killing the compositor to reclaim memory
# would end the session we are trying to keep responsive.
# --prefer targets what is realistically responsible and cheap to reopen.
#
# Two things about the syntax here, both easy to get wrong:
#
#   * No quotes around the regexes. earlyoom.service uses
#     `ExecStart=... $EARLYOOM_ARGS`, with no shell involved, so systemd splits
#     the value on whitespace and does NOT remove quotes. Quoting a regex the
#     way upstream's example file does would pass the quote characters into the
#     pattern, and it would silently never match. The regexes contain no
#     whitespace, so they survive the split intact without quoting.
#
#   * Patterns match `comm`, not a path: the first 15 bytes of the process
#     name. Anchoring with (^|/) as upstream's example does is meaningless
#     here, and every name below has to stay within 15 characters to match.

EARLYOOM_ARGS="-m 10,5 -s 10,5 -r 60 --avoid ^(systemd|sway|waybar|mako|swayidle|foot|dbus-daemon)$ --prefer ^(qutebrowser|chromium|electron|node)$"
