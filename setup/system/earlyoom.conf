# Early out-of-memory handling. Installed to /etc/default/earlyoom
#
# The kernel OOM killer only acts once the machine is already thrashing, by
# which point the desktop has been unresponsive for a long time. earlyoom
# watches available memory and kills something while the system is still
# usable.
#
# Thresholds are the upstream defaults, set explicitly so they are reviewable:
# warn at 10% available, kill at 5%. earlyoom requires BOTH memory and swap to
# be below their thresholds before killing, which is the behaviour we want
# alongside zram - a full zram device is entirely normal and only signifies
# trouble when available memory is low as well.
#
# --avoid protects the session itself: killing the compositor to reclaim memory
# would end the session we are trying to keep responsive.
# --prefer targets what is realistically responsible and cheap to reopen.
#
# Two things about the syntax here, both easy to get wrong:
#
#   * No quotes around the regexes. earlyoom.service uses
#     `ExecStart=... $EARLYOOM_ARGS`, with no shell involved, so systemd splits
#     the value on whitespace and does NOT remove quotes. Quoting a regex the
#     way upstream's example file does would pass the quote characters into the
#     pattern, and it would silently never match. The regexes contain no
#     whitespace, so they survive the split intact without quoting.
#
# qemu is in --avoid because killing a guest is not like killing a browser
# tab: it is a power cut to the machine inside, with the filesystem damage that
# implies. That protection is only safe because ~/.local/bin/vm always passes a
# fixed -m, so a guest cannot grow into the headroom earlyoom is now forbidden
# to reclaim from it.
#
# The name is exactly at the limit the rule below describes, which is luck
# rather than design: the binary is qemu-system-x86_64, and `comm` truncates it
# to the fifteen bytes "qemu-system-x86". Matching the full binary name here
# would silently never fire. See TASK-69.1.
#
#   * Patterns match `comm`, not a path: the first 15 bytes of the process
#     name. Anchoring with (^|/) as upstream's example does is meaningless
#     here, and every name below has to stay within 15 characters to match.

#   * `Isolated.Web.Co` below has dots where a space belongs, and that is the
#     rule above being obeyed rather than a typo. firefox names its content
#     processes "Isolated Web Content", `comm` truncates that to the fifteen
#     bytes "Isolated Web Co", and the spaces inside it would be split by
#     systemd into three arguments - the same silent never-matches failure the
#     quoting note describes. `.` matches a space in an extended regex, so the
#     pattern survives the split and still matches. Verified with
#     `ps -eo comm --sort=-rss`, not assumed: that is where the truncation is
#     visible.

EARLYOOM_ARGS="-m 10,5 -s 10,5 -r 60 --avoid ^(systemd|sway|waybar|mako|swayidle|foot|dbus-daemon|qemu-system-x86)$ --prefer ^(Isolated.Web.Co|firefox|qutebrowser|chromium|electron|node)$"

# firefox joined the --prefer list in TASK-183, when it became the browser
# rather than the thing kept for DRM. Both names are there and they are not the
# same choice: "Isolated Web Co" is one tab's content process, and killing it
# costs that tab; "firefox" is the parent, and killing it costs the browser.
# The content processes are also, in practice, the largest single consumers on
# this machine - `ps -eo comm,rss --sort=-rss` puts them above the parent - so
# earlyoom's own badness scoring will reach for a tab before the browser
# without needing to be told the order.
