# greetd, installed to /etc/greetd/config.toml
#
# greetd itself only handles authentication and launching. The login screen is
# ReGreet, which needs a compositor to display it, so cage hosts it as a kiosk.

[terminal]
vt = 1

[default_session]
# XDG_DATA_DIRS must be set explicitly. ReGreet derives its session directories
# from it, and falls back to a compiled-in default of /usr/share only. The
# greeter user has no environment of its own, so without this the entries in
# /usr/local/share/wayland-sessions are never read: the packaged sway.desktop
# would be offered instead, starting sway without uwsm and giving a desktop
# with no bar, notifications or idle handling.
#
# /usr/local/share comes first so our entries are found before the packaged
# ones, which is what lets a Hidden entry suppress the stock sway session.
#
# WLR_NO_HARDWARE_CURSORS matters for the same reason it does in the user
# session, and it has to be set here as well rather than only there.
#
# cage is wlroots, like sway. On a virtio GPU with 3D acceleration enabled the
# hardware cursor plane renders the cursor upside down, and the greeter runs
# first - so it sets an inverted cursor on the plane before any user session
# exists. Nothing clears it afterwards, which is why the inverted pointer
# survives logging in, switching to a text console with Ctrl+Alt+F2, and
# logging out again: it is one stale object held by the host, not something
# being redrawn.
#
# Setting it only in the user session gave a correct pointer drawn by sway with
# the greeter's stale one still visible underneath - two cursors rather than
# one.
command = "env XDG_DATA_DIRS=/usr/local/share:/usr/share WLR_NO_HARDWARE_CURSORS=1 cage -s -- regreet"
user = "greeter"
