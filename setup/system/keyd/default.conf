# keyd, installed to /etc/keyd/default.conf
#
# Swaps left Alt and left Control.
#
# Left Control is the modifier reached for most often - copy, paste, word-wise
# motion, terminal signals, every readline binding - and it sits in the far
# bottom corner under the weakest finger. Left Alt sits under a stronger one
# and is used far less. Swapping them puts the frequent modifier where the
# hand already rests.
#
# Done here rather than with sway's xkb_options because four things read a
# keyboard configuration independently on this system: sway, the console
# through /etc/vconsole.conf, the greeter, and XWayland. keyd remaps at the
# evdev layer, below all of them, so one file covers every context instead of
# four being kept in agreement. A swap present in three of the four would be
# worse than none at all: the one left out would be the console, which is what
# Ctrl+Alt+F2 reaches when the session will not start - exactly when muscle
# memory is least available.

[ids]

# Every keyboard. An external keyboard laid out differently would need its own
# section keyed by device id, which `keyd -m` reports.
*

[main]

# layer(...) rather than a direct key assignment. Assigning leftcontrol =
# leftalt emits the Alt keycode; it does not make the key behave as the Alt
# modifier, and keyd warns about exactly this. The layer form is what gives the
# key its modifier semantics, so combinations compose the way they should.
#
# Both directions, or the swap is a move rather than a swap: mapping one side
# only leaves two keys doing the same thing and the other function unreachable.
leftcontrol = layer(alt)
leftalt = layer(control)

# Caps Lock becomes a scroll layer: hold it and j/k scroll, d/u page.
#
# The problem this solves is that scrolling is not one thing. j/k works in less,
# man, nvim and a browser with an extension; it does nothing in a GTK file
# dialog, a PDF viewer or Zathura's sibling tools; and inside any text input it
# types the letter instead. Page Up and Page Down are more widely understood but
# move the caret rather than the view when a text field has focus, which is the
# case the whole idea was for.
#
# So the layer emits two different things deliberately, because no single event
# reaches everything:
#
#   j / k / h / l  emit real mouse wheel events, on keyd's virtual pointer.
#                  A wheel event goes to the surface under the POINTER, so it
#                  ignores keyboard focus entirely - it scrolls a text area
#                  while the caret sits in it, and scrolls programs that have
#                  no keyboard scrolling at all. The cost is that it scrolls
#                  whatever the pointer happens to be over - which is why
#                  `mouse_warping container` was set in sway's 10-input.conf,
#                  FOR THIS: it keeps the pointer on the focused window, so the
#                  wheel and the keyboard agree unless the pointer is moved by
#                  hand afterwards.
#
#   d / u          emit Page Down and Page Up, which go to whatever has
#                  KEYBOARD focus. This is the answer when the pointer is over
#                  some other window, and it is the vim mnemonic for a page.
#
# That the pointer device really can carry a wheel is checked, not assumed:
#
#     $ awk '/keyd virtual pointer/,/^$/' /proc/bus/input/devices
#     B: REL=147
#
# 0x147 has bit 8 (REL_WHEEL) and bit 6 (REL_HWHEEL) set, so the device keyd
# already creates advertises both axes and sway routes them like any mouse.
#
# macro2 rather than a bare `j = scrolldown`, because a wheel event has no
# press and no release. Auto-repeat is generated by the compositor from a key
# being held down, and there is no key here to hold - a plain mapping would
# emit exactly one wheel click however long j is held. macro2(<delay>,
# <interval>, <macro>) makes keyd do the repeating itself. 250ms and 40ms match
# the repeat_delay and repeat_rate set in sway's 10-input.conf, so holding j
# feels the same as holding an arrow key.
#
# Why Caps Lock and not f, which is what the idea was first sketched with.
# Overloading a letter key means every press of that letter becomes a tap-hold
# decision, and keyd's letter-safe form, lettermod(scroll, f, 150, 200), still
# leaves a window: an f struck more than 150ms after the previous key - which
# is every f that starts a word after any pause - resolves as a HOLD if another
# key is tapped inside it. Type "For" after a pause with a normal rolled
# overlap and the f can be swallowed, leaving "or". That is a silent dropped
# character in ordinary prose, indistinguishable from a bad keyboard, and it
# would also break nvim's f, which is find-character and is used exactly in
# that after-a-pause position. Caps Lock costs none of this: it is never struck
# while typing, it has no repeat behaviour worth keeping, and it is the key
# keyd's own manual uses for this. It matters more here than it would elsewhere
# because this file is read by the console and the greeter too, so an ambiguous
# letter would be ambiguous on the rescue VT as well.
#
# What this cost at first was the caps lock itself. The binding was
# `layer(scroll)`, tapping the key did nothing, and that was written down here
# as an accepted trade-off - which it turned out not to be. THE BLOCK BELOW IS
# WHAT REPLACED IT, and it is the current behaviour: tapping Caps Lock toggles
# caps again. `overload(scroll, capslock)` was still the wrong way to get that
# back, because a hold-then-think-better-of-it latches caps silently on
# release; overloadt2 is why the tap could come back safely.
#
# Keys with no binding in the layer fall through to the main layer, so holding
# Caps Lock and pressing some other letter types that letter.

# TAPPING IT STILL TOGGLES CAPS, and that was not true at first.
#
# This was `layer(scroll)`, which takes the key over completely - the scroll
# layer worked and Caps Lock stopped locking caps, which was recorded as an
# accepted trade and turned out not to be accepted.
#
# overloadt2 gives both: released inside 200ms with nothing pressed, it is a
# plain capslock; held longer, or held while another key is tapped, it is the
# layer. The "intervening key tap resolves as hold" rule is what made this form
# dangerous on a letter - it is why hold-`f` could swallow the `f` in "For" -
# and it is harmless here, because nobody types Caps Lock in the middle of a
# word. The property that made it a bad fit for `f` is the property that makes
# it the right fit for this key.
# THE KEYBOARD LIGHT WILL NOT AGREE, AND THAT IS NOT THIS CONFIG'S DOING.
#
# Tapping Caps Lock toggles caps correctly - what gets typed is right - while
# the LED on a physical keyboard does not follow. IT IS THE VM, AND ONLY THE VM,
# which was established by watching rather than reasoned about.
#
# Both /sys/class/leds entries - the emulated i8042 keyboard and keyd's virtual
# one - were watched across real Caps Lock presses, and they flip TOGETHER. So
# sway does set the LED on the physical device despite keyd having grabbed it
# (a grab blocks other readers, it does not block writing LED state), and keyd's
# indirection is not the problem here.
#
# What is missing is a light. This machine is a KVM guest with an emulated i8042
# keyboard (Phys=isa0060/serio0); nothing physical is attached to that LED, and
# the light on the real keyboard belongs to the HOST, which keeps its own caps
# state and is told nothing by the guest.
#
# The EXPECTATION, then, is that this resolves itself on real hardware: the
# device sway is already updating would be the keyboard the light belongs to.
# That is an expectation and not a result. Nothing in this repository or its
# backlog records this build ever running on physical hardware, so nobody has
# watched the light on metal. Whoever boots it there first: look at the Caps
# Lock light, and correct this comment whichever way it goes.
#
# If an on-screen indicator is ever wanted anyway, waybar has a keyboard-state
# module for it - not enabled, because it requires membership of the `input`
# group, which grants read access to every keystroke on the machine.
capslock = overloadt2(scroll, capslock, 200)

[scroll]

j = macro2(250, 40, scrolldown)
k = macro2(250, 40, scrollup)
h = macro2(250, 40, scrollleft)
l = macro2(250, 40, scrollright)

d = pagedown
u = pageup

# ---------------------------------------------------------------------------

# CTRL+K IS ANOTHER ESCAPE, UNDERNEATH EVERYTHING.
#
# Escape is the most-reached-for key on a machine shaped like this one - nvim,
# the backlog TUI, rofi, qutebrowser, fzf and every prompt want it - and it is
# the furthest key on the board from where the hands rest. Ctrl+K puts it on
# the home row: k is the right middle finger, and after the swap above the
# Control the system receives is physically the key beside the space bar, under
# the left thumb. Ctrl+J is already Enter at the terminal (it is ASCII LF), so
# Ctrl+K for the other way out of a thing reads as its counterpart.
#
# Here rather than anywhere else because Escape has to arrive INSIDE the
# application. sway cannot rebind a key within a program, chezmoi can only
# reach programs that have a config file, and the two places it is wanted most
# - a TUI and a browser - are the two that cannot be configured for it from
# this repository. keyd emits a real Escape key event at the evdev layer, so
# every program sees the same thing it would see from the Escape key itself.
#
# WHAT THIS COSTS, since it is not free and every one of these was checked on
# this machine rather than assumed:
#
#   zsh          Ctrl+K was kill-line, the only binding for it. Moved to Alt+K
#                in dot_zshrc rather than simply dropped.
#   nvim         Ctrl+K was `<C-w>k`, move to the split above. That mapping is
#                now removed from init.lua - it could never fire again, and a
#                mapping that looks right and does nothing is this repository's
#                signature bug. `<C-w>k` still works.
#   fzf          Ctrl+K was `up`. Ctrl+P and the arrow key remain. Note that
#                Ctrl+K now ABORTS fzf rather than moving the selection, which
#                is a surprise the first time and the point every time after.
#   lazygit      Ctrl+K was moveUpCommit in a rebase. Alt+Up remains.
#   qutebrowser  Ctrl+K was rl-kill-line in command and prompt modes only.
#   rofi         Ctrl+K was kb-remove-to-eol.
#   yazi         Ctrl+K was kill-eol in its input line.
#   foot         Ctrl+K was delete-to-end inside scrollback search.
#   firefox      Ctrl+K focuses the search bar. Ctrl+L still reaches the
#                address bar, which searches too.
#
# The last five all traded a kill-to-end-of-line for an Escape that leaves the
# thing entirely, which is closer to what the key was reached for anyway.
# sway binds no Ctrl+K at all - its k is $mod+k - and the backlog TUI binds
# only Ctrl+S, so the two contexts this was asked for cost nothing.
#
# WHY NOT the obvious alternatives:
#
#   Caps Lock tapped. The usual answer, and ruled out above: tapping it toggles
#   caps, which was taken away once and put back deliberately.
#   Caps Lock HELD is already the scroll layer, and Caps+k is scroll up.
#
#   A j+k chord. keyd supports it, and it makes every j and every k wait out
#   the chord interval before being emitted - latency on the two keys nvim
#   navigates with.
#
#   A letter held as a modifier (lettermod/overloadi). Rejected for the scroll
#   layer above for the same reason it is rejected here: a held letter is a
#   silently dropped character in ordinary prose.
#
#   Ctrl+semicolon. Costs NOTHING - no ASCII control code exists for it, so no
#   terminal program can bind it, and nothing on this machine does. Under the
#   right little finger, which is already on it. It is the cheaper key and it
#   is a worse mnemonic; if the losses above turn out to bite, changing the
#   line below to `semicolon = esc` is the whole edit.
#
# Bindings elsewhere in the layer are untouched, so Ctrl+C, Ctrl+D, Ctrl+R and
# the rest are unaffected - a modifier layer falls through for keys it does not
# name. keyd's panic sequence (Backspace+Escape+Enter held together, which
# terminates keyd and hands the keyboard back) does not involve k and is
# unaffected.
[control]

# BOTH, ON PURPOSE AND ON A CLOCK. TASK-110 ends this.
#
# Ctrl+K was chosen for its mnemonic - Ctrl+J is effectively Enter, so Ctrl+K
# for Escape reads naturally - and Ctrl+semicolon turned up in the research as
# the key that costs nothing at all: there is no ASCII control code for
# semicolon, so no terminal program CAN bind it, and none here does.
#
# Cost is therefore not what is being compared; that is already settled. What
# is being compared is which one the hand reaches for, and only using both
# answers that. So both are bound while the question is open.
#
# This is a trial, not a design. Two bindings for one action is the thing this
# repository argues against, and it is tolerable here only because the ticket
# that removes one of them exists. If you are reading this and TASK-110 is
# closed, one of these lines should have gone with it.
k = esc
semicolon = esc

# ---------------------------------------------------------------------------

# ALT+HJKL IS THE ARROW CLUSTER, MOVED ONTO THE HOME ROW.
#
# The arrows are the one cluster this keyboard cannot reach without lifting
# the whole right hand off the home row and putting it back afterwards.
# Alt+hjkl puts them under the fingers already resting there, and after the
# swap at the top of this file Alt is the physical bottom-left key - a pinky
# stretch rather than a hand move. That comparison is the reason this exists
# and it was settled by using it, not by argument.
#
# h/j/k/l rather than any other four because vim, less, man, yazi, fzf and the
# scroll layer above already mean left/down/up/right by them.
#
# Here rather than per-application for the same reason Ctrl+K is here: an
# arrow key has to arrive INSIDE the program, and the programs that want it
# most are the ones this repository has no config file for.
#
# WHAT IT EMITS, observed rather than assumed. keyd's manual says bindings are
# not affected by the modifiers of the layer they are defined in; a uinput
# probe reading keyd's own virtual keyboard back confirms it:
#
#   Alt+h             -> Left              no modifier held at the keypress
#   Alt+Shift+h       -> Shift+Left        select
#   Alt+Ctrl+h        -> Ctrl+Left         word-wise
#   Alt+Ctrl+Shift+h  -> Ctrl+Shift+Left   select word-wise
#
# The last three are what make these arrow keys rather than an imitation of
# them, and they need no configuration: keyd strips only the layer's OWN
# modifier, so Shift and Control pass through and compose. This was measured
# before the rest was written, because an arrow that cannot select or jump a
# word would have been half a feature dressed as a whole one.
#
# THE SIDE EFFECT, also measured, because it is not obvious and it is not
# nothing. To emit a bare key keyd releases the modifier and re-presses it
# afterwards, so a transient Alt press surrounds every one of these. A bare
# Alt tap OPENS THE MENU BAR in Firefox and in GTK applications - that was
# screenshotted here rather than reasoned about, and it really does. It does
# not fire for Alt+hjkl: keyd presses Control inside the Alt hold, and an
# intervening key cancels the bare-tap gesture. Five Alt+h in a row left the
# menu bar shut. If a future keyd changes how it clears modifiers, THIS is
# the thing that breaks, and it will look like a flickering menu bar.
#
# WHAT IT COSTS. Every line below was asked of the program on this machine,
# not recalled:
#
#   zsh          Alt+h was run-help, Alt+l down-case-word, Alt+j nothing, and
#                Alt+k kill-line - which was only there because TASK-108 moved
#                it off Ctrl+K. kill-line is NOT replaced this time; see the
#                note where it used to be bound in dot_zshrc.
#   yazi         Alt+j and Alt+k step the COMPLETION popup - and Up and Down
#                are bound to those same two actions, in the same keymap, two
#                lines below. So remapping them changes nothing whatsoever.
#                yazi had independently reached for Alt+jk as an alias for the
#                arrows in a text field, which is this feature in miniature.
#   firefox      Alt+H opened the Help menu. Everything in it is reachable
#                from the hamburger menu.
#   GTK dialogs  Any dialog whose mnemonic is h, j, k or l loses that Alt
#                shortcut - _Help most often. Tab and the pointer still reach
#                it. This is the one entry here that CANNOT be enumerated
#                exhaustively, because the set of dialogs is open-ended.
#   fzf          Nothing. Its Alt bindings are b, d, f, backspace and the four
#                arrows - so Alt+j and Alt+k now do exactly what alt-down and
#                alt-up did, by a shorter route.
#   nvim         Nothing. It has no Alt mapping at all, established by dumping
#                every keymap rather than by reading init.lua.
#   sway         Nothing. All 76 bindings use $mod, Shift or Ctrl.
#   rofi         Nothing bare. Ctrl+Alt+h is kb-remove-word-back and stays so:
#                a layer only takes the keys it names.
#   foot         Nothing. Its Alt bindings are b, d, f and backspace.
#   lazygit      Nothing.
#   qutebrowser  Nothing - it binds no Alt shortcut at all.
#   backlog TUI  Nothing. It binds Alt+B and Alt+Q only.
#
# Right Alt is layer(altgr) and is untouched, so this is the left-hand key
# alone - which is the one the reach was measured with.
[alt]

h = left
j = down
k = up
l = right
