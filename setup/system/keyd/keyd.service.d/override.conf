# Refuses to start keyd inside a VM guest. See TASK-160.
#
# TASK-40 swaps left Alt and left Control below xkb, at the evdev layer, so
# sway, the console, the greeter and XWayland all inherit one remap. TASK-69.2
# builds this repository's VM base image by running the real, unmodified
# 03-system.sh/04-desktop.sh install stages inside a chroot - so a guest
# cloned from that image gets this exact keyd config installed and enabled
# too, same as bare metal.
#
# That is correct for a machine that IS the keyboard's only owner, and wrong
# for a guest launched from ~/.local/bin/vm on a host that already has its own
# keyd running. keyd sits below the compositor, so by the time a keypress
# reaches sway - and therefore QEMU, which is just another Wayland client -
# the host has already swapped it. QEMU forwards that already-swapped
# keycode to the guest's virtio-keyboard device unchanged. A second keyd
# swapping it again inside the guest cancels the first, and the user is left
# with an unswapped keyboard exactly where TASK-40 says it should be swapped.
#
# ConditionVirtualization is evaluated on every unit start, not baked in once,
# so this self-corrects if sync.sh is re-run inside a guest that already has
# keyd active from an older image, and costs nothing on real hardware or a
# machine that runs this desktop as its own primary OS rather than as a
# nested guest - "vm" there means false, so the condition passes and keyd
# starts exactly as TASK-40 intends.
#
# This deliberately cannot distinguish "a nested guest launched by this
# repository's own vm tooling, receiving pre-swapped keys" from "this
# desktop installed directly inside someone else's VM as its only OS,
# receiving genuinely unswapped keys from a host with no keyd of its own".
# The first is the scenario ~/.local/bin/vm exists for and is what TASK-160
# fixes; the second is not a use case this repository currently supports
# (TASK-141 removed every assumption that the reference machine itself is a
# VM), so trading it away here is deliberate rather than an oversight.
[Unit]
ConditionVirtualization=!vm
