# Refuses to start keyd inside a guest launched by this repo's own vm
# tooling. See TASK-160 and TASK-166.
#
# TASK-40 swaps left Alt and left Control below xkb, at the evdev layer, so
# sway, the console, the greeter and XWayland all inherit one remap. TASK-69.2
# builds this repository's VM base image by running the real, unmodified
# 03-system.sh/04-desktop.sh install stages inside a chroot - so a guest
# cloned from that image gets this exact keyd config installed and enabled
# too, same as bare metal.
#
# That is correct for a machine that IS the keyboard's only owner, and wrong
# for a guest launched from ~/.local/bin/vm on a host that already has its own
# keyd running. keyd sits below the compositor, so by the time a keypress
# reaches sway - and therefore QEMU, which is just another Wayland client -
# the host has already swapped it. QEMU forwards that already-swapped
# keycode to the guest's virtio-keyboard device unchanged. A second keyd
# swapping it again inside the guest cancels the first, and the user is left
# with an unswapped keyboard exactly where TASK-40 says it should be swapped.
#
# TASK-160's FIRST ATTEMPT used ConditionVirtualization=!vm, on the reasoning
# that a nested guest is a VM and bare metal is not. That is not the
# distinction that matters: ConditionVirtualization only reports the
# hypervisor class (kvm, qemu, ...), which is identical whether this machine
# is a nested guest of this repo's own vm tool or a top-level VM running this
# desktop as its ONLY operating system, with no host-side keyd upstream of it
# at all. The condition could not tell those apart, so it disabled keyd on
# every VM - including the second case, where nothing has swapped the keys
# and keyd not running means the keyboard is simply unswapped. TASK-166 is
# that bug report.
#
# THE FIX is a marker, not a virtualization class. ~/.local/bin/vm tags every
# guest it launches with an SMBIOS field:
#
#     -smbios type=1,family=arch-repo-vm-guest
#
# which the guest kernel exposes, unprivileged, at
# /sys/class/dmi/id/product_family. Nothing else on any machine built from
# this repository sets that field, so its presence means specifically "this
# machine is a nested guest of this repo's own vm tool" - not "this machine
# happens to run under some hypervisor". ExecCondition is the systemd
# mechanism for a check that isn't one of the built-in Condition= directives:
# a non-zero exit from it skips starting the unit, the same way a failed
# Condition does, without marking it failed.
#
# ConditionVirtualization is gone entirely rather than combined with the
# marker check - the marker alone says exactly what matters, and a top-level
# VM with no marker set now takes the same path as bare metal.
[Unit]
ExecCondition=/usr/bin/sh -c '[ "$(cat /sys/class/dmi/id/product_family 2>/dev/null)" != "arch-repo-vm-guest" ]'
