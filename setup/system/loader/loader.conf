default arch.conf
# One second, not three. TASK-90.
#
# systemd-analyze reports 4.653s for this machine and that figure leaves out the
# menu entirely: it accounts from the kernel onwards unless the bootloader
# exports LoaderTimeInitUSec into an EFI variable, and OVMF does not. So the
# three seconds spent looking at a menu were counted nowhere, while the real
# wait to a greeter was nearer 7.7s - about 39% of it a menu nobody reads.
#
# NOT zero, which was the obvious answer. systemd-boot(7) says the menu can
# still be reached with timeout 0 by holding space, and then adds the part that
# decides this: "depending on the firmware implementation the time window where
# key presses are accepted before the boot loader initializes might be short. If
# the window is missed, reboot and try again, possibly repeatedly." The menu
# exists to reach the fallback entry, which is what you want on the boot where
# something is already wrong - a recovery path that takes several attempts to
# hit is the wrong thing to economise on.
#
# One second is a deterministic window and gives back two thirds of the cost.
# For a planned fallback boot there is also `bootctl set-timeout-oneshot`, which
# arms the menu for the next boot only, from a working system.
timeout 1
console-mode max
editor no
