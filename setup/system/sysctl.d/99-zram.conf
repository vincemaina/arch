# Kernel tuning for a system whose only swap is zram.
# Installed to /etc/sysctl.d/99-zram.conf

# The default of 60 is tuned for swap on a disk, where paging out is expensive
# and worth avoiding. Compressing a page into RAM costs far less than writing
# it to an SSD, so swapping early is the cheaper choice here.
vm.swappiness = 180

# Read-ahead on swap-in exists to amortise disk seeks. zram has no seeks, so
# faulting in neighbouring pages just wastes work and memory.
vm.page-cluster = 0
