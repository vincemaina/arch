# Turn zswap off, so the compressed swap this system configures is the one
# doing the work. Installed to /etc/tmpfiles.d/zswap.conf
#
# WHY THIS FILE EXISTS
#
# The Arch kernel is built with CONFIG_ZSWAP_DEFAULT_ON=y, so zswap is enabled
# on every boot whether anyone asked for it or not. zswap is a compressed cache
# that sits IN FRONT OF a swap device: pages are compressed into its own pool,
# capped at 20% of RAM, and only what that pool cannot hold is written back to
# the device behind it.
#
# With zram as the swap device that arrangement is pure overhead. A page is
# compressed into zswap, and on writeback it is decompressed and handed to zram,
# which compresses it again - two compressions and a decompression to store one
# page, both times in RAM. And it happens rarely enough to be invisible:
# measured over ten and a half hours on the reference machine, 920,911 pages
# went into zswap and 9,415 - one percent - ever reached zram, which peaked at
# 7 MiB of a 1,951 MiB device.
#
# zswap earns its place in front of a DISK. DECISIONS.md rejected disk swap.
#
# WHY tmpfiles AND NOT THE KERNEL COMMAND LINE
#
# zswap.enabled=0 on the cmdline is the more usual answer and would be the
# better one if this repository could apply it to a running machine. It cannot:
# the boot entries under system/loader/ are rendered with the root UUID at
# install time and are deliberately never applied by sync, so a cmdline change
# would reach a fresh install and no existing machine. A change that only lands
# on machines nobody has yet is the kind that goes unnoticed for months.
#
# zswap is built into the kernel rather than a module, so modprobe.d has nothing
# to act on either. The parameter is writable at runtime through sysfs, and
# tmpfiles is the mechanism systemd provides for writing sysfs at boot - so one
# file covers the fresh install and the sync, and apply-config.sh --activate
# makes it take effect immediately rather than at the next reboot.
w /sys/module/zswap/parameters/enabled - - - - N
