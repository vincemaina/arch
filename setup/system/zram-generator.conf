# Compressed swap in RAM. Installed to /etc/systemd/zram-generator.conf
#
# Sized as a fraction rather than a fixed figure: this repository targets a
# 16 GB machine but has to work unchanged on a VM with a fraction of that.
# min(ram / 2, 8192) gives 8 GB on the former and half the memory on the latter.

[zram0]
zram-size = min(ram / 2, 8192)
compression-algorithm = zstd

# Above the -2 that disk swap defaults to, so compressed swap is always
# preferred if a swapfile is ever added alongside it.
swap-priority = 100
